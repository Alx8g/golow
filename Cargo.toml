[package]
name = "soundcloud-go-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.37"
wry = "0.57"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
