name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node --test "tests/*.test.mjs"
      - run: cargo build --locked --release
      - name: Package
        run: |
          New-Item -ItemType Directory dist/golow/assets | Out-Null
          Copy-Item target/release/golow.exe, install.ps1, uninstall.ps1, LICENSE, README.md dist/golow
          Copy-Item assets/icon.ico dist/golow/assets
          Compress-Archive dist/golow/* dist/golow-windows-x64.zip
          # The in-app updater downloads golow.exe and checks it against this SHA-256.
          Copy-Item target/release/golow.exe dist
          "$((Get-FileHash dist/golow.exe -Algorithm SHA256).Hash.ToLower())  golow.exe" | Set-Content -NoNewline -Encoding ascii dist/golow.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: golow-windows-x64
          path: |
            dist/golow-windows-x64.zip
            dist/golow.exe
            dist/golow.exe.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: golow-windows-x64}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            golow-windows-x64.zip
            golow.exe
            golow.exe.sha256
